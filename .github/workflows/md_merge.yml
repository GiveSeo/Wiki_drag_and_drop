name: Merge Selected Wiki to PDF

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 한국시간 0시에 실행 (UTC 15:00)
  workflow_dispatch:       # 수동 실행
  repository_dispatch:     # 외부 트리거 (예: wiki 수정 감지)
    types: [wiki-updated]

env:
  REPO_OWNER: GiveSeo
  REPO_NAME: Wiki_drag_and_drop
  WIKI_REPO_NAME: Wiki_drag_and_drop.wiki
  PDF_FILENAME: Wiki_ALL.pdf
  COMMITTER_NAME: github-actions[bot]
  COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
  BRANCH: main

jobs:
  merge_and_convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.BRANCH }}

      - name: Clone Wiki repository
        run: |
          git clone https://github.com/${{ env.REPO_OWNER }}/${{ env.WIKI_REPO_NAME }}.git wiki

      - name: Merge specific wiki files
        run: |
          cd wiki
          FILES=(
            "기타.md"
            "논리.md"
            "색상.md"
            "리스트.md"
            "연산.md"
            "문자열.md"
            "변수.md"
            "반복.md"
            "소리.md"
            "함수.md"
            "조건문.md"
            "제어.md"
          )

          echo "# Wiki 합본" > ../wiki_combined.md
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo -e "\n\n---\n## ${file%.*}\n" >> ../wiki_combined.md
              cat "$file" >> ../wiki_combined.md
            else
              echo "⚠️ 파일 없음: $file"
            fi
          done

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert merged markdown to PDF
        run: |
          pandoc wiki_combined.md -o ${{ env.PDF_FILENAME }} --pdf-engine=xelatex
          ls -lh ${{ env.PDF_FILENAME }}

      - name: Commit and push PDF to main branch
        run: |
          git config user.name "${{ env.COMMITTER_NAME }}"
          git config user.email "${{ env.COMMITTER_EMAIL }}"
          git add ${{ env.PDF_FILENAME }} wiki_combined.md
          git commit -m "Auto-update: merged selected wiki files and generated PDF" || echo "No changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ env.REPO_OWNER }}/${{ env.REPO_NAME }}.git ${{ env.BRANCH }}
